<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080b14" />
    <meta
      name="description"
      content="Search any city and scrape the map for nearby venues, festivals and live events — powered by OpenStreetMap."
    />

    <title>Event Map Scraper — find events near you</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://nominatim.openstreetmap.org" />
    <link rel="preconnect" href="https://overpass-api.de" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Open Graph, so shared search links unfurl nicely. -->
    <meta property="og:title" content="Event Map Scraper" />
    <meta
      property="og:description"
      content="Type a city. Get every venue, festival and live event around it, on a map."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
